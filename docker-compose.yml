services:
  # Database Service (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: fms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: ${POSTGRES_DB:-ums_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ums_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fms-network

  # Next.js Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fms-app:latest
    container_name: fms-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1234}@postgres:5432/${POSTGRES_DB:-ums_dev}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-NJxC5nl33e2lrh88Jm1lemXdsY1XxI7mouliucGyPAU=}
      AUTH_TRUST_HOST: "true"
      APP_URL: ${APP_URL:-http://localhost:3010}
      PORT: 3010
      AUTO_SEED: ${AUTO_SEED:-1}
      SEED_ALLOW_PROD: ${SEED_ALLOW_PROD:-1}
    ports:
      - "${APP_PORT:-3010}:3010"
    networks:
      - fms-network

volumes:
  postgres_data:
    name: fms_postgres_data

networks:
  fms-network:
    name: fms_network
    driver: bridge
