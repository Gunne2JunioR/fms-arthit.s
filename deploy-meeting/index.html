      const [activeTab, setActiveTab] = useState('home');

      const [docRequester, setDocRequester] = useState('');

      const [loginUser, setLoginUser] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [loginError, setLoginError] = useState('');

      const [showAddStaffModal, setShowAddStaffModal] = useState(false);
      const [staffTitle, setStaffTitle] = useState('ดร.');
      const [staffFnTh, setStaffFnTh] = useState('');
      const [staffLnTh, setStaffLnTh] = useState('');
      const [staffFnEn, setStaffFnEn] = useState('');
      const [staffLnEn, setStaffLnEn] = useState('');
      const [staffDeptTh, setStaffDeptTh] = useState('สาขาวิชาเทคโนโลยีสารสนเทศ');

      const [staffDeptCn, setStaffDeptCn] = useState('信息技术专业');
      const [staffPos, setStaffPos] = useState('อาจารย์ประจำ');
      const [staffEmail, setStaffEmail] = useState('');
      const [staffPhone, setStaffPhone] = useState('9200');
      const [staffRoom, setStaffRoom] = useState('401');
      const [staffAvatar, setStaffAvatar] = useState('https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400');
      const [staffExpertise, setStaffExpertise] = useState('Data Science, AI');

      // Admin Sub-tab inside Admin mode
      const [adminSubTab, setAdminSubTab] = useState('bookings');

      const t = DICT[lang] || DICT.th;

      const handleLogin = (e) => {
        e.preventDefault();
        setLoginError('');
        // Accept webadmin / kRG4FhZ97wHMda5K or admin / Passw0rd!vibe
        if (
          (loginUser === 'webadmin' && loginPass === 'kRG4FhZ97wHMda5K') ||
          (loginUser === 'admin' && (loginPass === 'Passw0rd!vibe' || loginPass === 'kRG4FhZ97wHMda5K'))

          sessionStorage.setItem('fms_admin_logged', '1');
          setIsAdmin(true);
          setShowLoginModal(false);
          setLoginUser('');
          setLoginPass('');
          setActiveTab('admin');
        } else {
          setLoginError('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง (Invalid username or password)');
        }
      };

      const handleLogout = () => {
        sessionStorage.removeItem('fms_admin_logged');
        setIsAdmin(false);
        if (activeTab === 'admin') {
          setActiveTab('home');
        }
      };

      const handleUpdateBookingStatus = (id, status) => {
        if (!confirm(`ยืนยันเปลี่ยนสถานะเป็น ${status}?`)) return;
        fetch('api.php?action=bookings', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, status })
        })
        .then(r => r.json())
        .then(res => {
          loadData();
        })
        .catch(err => alert('เกิดข้อผิดพลาด'));
      };

      const handleDeleteBooking = (id) => {
        if (!confirm('ยืนยันลบรายการจองนี้?')) return;
        fetch(`api.php?action=bookings&id=${id}`, { method: 'DELETE' })
          .then(r => r.json())
          .then(() => loadData())
          .catch(() => alert('เกิดข้อผิดพลาดในการลบ'));
      };

      // Admin Actions: Documents
      const handleUpdateDocStatus = (id, status, step) => {
        if (!confirm(`ยืนยันการ${status === 'APPROVED' ? 'อนุมัติ' : 'ปรับสถานะ'}?`)) return;
        fetch('api.php?action=documents', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, status, step })
        })
        .then(r => r.json())
        .then(() => loadData())
        .catch(() => alert('เกิดข้อผิดพลาด'));
      };

      const handleDeleteDoc = (id) => {
        if (!confirm('ยืนยันลบเอกสารนี้?')) return;
        fetch(`api.php?action=documents&id=${id}`, { method: 'DELETE' })
          .then(r => r.json())
          .then(() => loadData())
          .catch(() => alert('เกิดข้อผิดพลาดในการลบ'));
      };

      // Admin Actions: News
      const handleCreateNews = (e) => {
        e.preventDefault();
        fetch('api.php?action=news', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: newsTitle,
            slug: 'news-' + Date.now(),
            category: newsCategoryTh,
            category_th: newsCategoryTh,
            category_en: newsCategoryEn,
            category_cn: newsCategoryCn,
            excerpt: newsExcerpt,
            content: newsContent,
            cover_image_url: newsImage,
            is_pinned: newsPinned ? 1 : 0

        .then(r => r.json())
        .then(res => {
          setShowAddNewsModal(false);
          setNewsTitle('');
          setNewsExcerpt('');
          setNewsContent('');
          loadData();
          alert('เพิ่มข่าวเรียบร้อย!');
        })
        .catch(() => alert('เกิดข้อผิดพลาดในการบันทึกข่าว'));
      };

      const handleDeleteNews = (id) => {
        if (!confirm('ยืนยันลบข่าวนี้?')) return;
        fetch(`api.php?action=delete_news&id=${id}`, { method: 'DELETE' })

          .then(() => loadData())
          .catch(() => alert('เกิดข้อผิดพลาดในการลบ'));
      };

      // Admin Actions: Staff

        e.preventDefault();
        fetch('api.php?action=staff', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            academic_title: staffTitle,
            first_name_th: staffFnTh,
            last_name_th: staffLnTh,
            first_name_en: staffFnEn,
            last_name_en: staffLnEn,
            department_th: staffDeptTh,
            department_en: staffDeptEn,
            department_cn: staffDeptCn,
            position: staffPos,
            email: staffEmail,
            phone_ext: staffPhone,
            room_number: staffRoom,
            avatar_url: staffAvatar,
            expertise: staffExpertise,
            sort_order: 10
          })
        })
        .then(r => r.json())
        .then(() => {
          setShowAddStaffModal(false);
          setStaffFnTh('');
          setStaffLnTh('');
          setStaffEmail('');
          loadData();
          alert('เพิ่มบุคลากรเรียบร้อย!');
        })
        .catch(() => alert('เกิดข้อผิดพลาดในการเพิ่ม'));
      };

      const handleDeleteStaff = (id) => {
        if (!confirm('ยืนยันลบข้อมูลบุคลากรนี้?')) return;
        fetch(`api.php?action=staff&id=${id}`, { method: 'DELETE' })
          .then(r => r.json())
          .then(() => loadData())
          .catch(() => alert('เกิดข้อผิดพลาดในการลบ'));
      };

      const cycleLang = () => {
        if (lang === 'th') setLang('en');
        else if (lang === 'en') setLang('cn');
        else setLang('th');
      };

      const loadData = () => {
        setLoading(true);
        Promise.all([
          fetch('api.php?action=news').then(r => r.json()),
          fetch('api.php?action=staff').then(r => r.json()),
          fetch('api.php?action=programs').then(r => r.json()),
          fetch('api.php?action=bookings').then(r => r.json()),
          fetch('api.php?action=documents').then(r => r.json()),
        ]).then(([n, s, p, b, d]) => {
          setNews(n.data || []);
          setStaff(s.data || []);
          setPrograms(p.data || []);
          setBookings(b.data || []);
          setDocuments(d.data || []);
          setLoading(false);
        }).catch(err => {
          console.error(err);
          setLoading(false);
        });
      };

      useEffect(() => {
        loadData();
      }, []);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const handleCreateBooking = (e) => {
        e.preventDefault();
        setBookSubmitting(true);
        fetch('api.php?action=bookings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            resource_id: bookResource,
            resource_name: bookResource === 'room-1' ? 'ห้องประชุมปัญญานันทะ ชั้น 4' : 'รถตู้ส่วนกลาง ทะเบียน 1กข-9999',

            purpose: bookPurpose,
            attendees: bookAttendees,
            start_time: bookStart,
            end_time: bookEnd,
            requester_name: bookRequester,
            requester_email: 'contact@faculty.ac.th',
            note: 'ส่งคำขอจองผ่านเว็บพอร์ทัล'
          })

        .then(r => r.json())
        .then(res => {
          setBookSubmitting(false);
          if (res.error) {
            alert(res.error);
          } else {
            alert('ส่งคำขอจองสำเร็จ!');
            setShowBookingModal(false);
            setBookPurpose('');
            setBookRequester('');
            loadData();
          }
        })
        .catch(err => {
          setBookSubmitting(false);
          alert('เกิดข้อผิดพลาดในการเชื่อมต่อ');
        });
      };

      const handleCreateDoc = (e) => {
        e.preventDefault();
        setDocSubmitting(true);
        fetch('api.php?action=documents', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: docTitle,
            doc_type: docType,
            urgency: docUrgency,
            requester_name: docRequester,
            content: docContent
          })

        .then(r => r.json())
        .then(res => {
          setDocSubmitting(false);
          if (res.error) {
            alert(res.error);
          } else {
            alert('ยื่นคำขออนุมัติเอกสารเรียบร้อย! เลขที่: ' + res.doc_number);

            setDocTitle('');
            setDocContent('');
            setDocRequester('');
            loadData();

        .catch(err => {
          setDocSubmitting(false);
          alert('เกิดข้อผิดพลาดในการเชื่อมต่อ');

                  <div className="flex items-center gap-2">
                    <input type="checkbox" id="newsPinned" checked={newsPinned} onChange={e => setNewsPinned(e.target.checked)} className="rounded" />
                    <label htmlFor="newsPinned" className="text-slate-700 font-medium">ปักหมุดไว้หน้าแรก (Featured News)</label>
                  </div>
                  <div className="flex items-center justify-end gap-2 pt-3 border-t">
                    <button type="button" onClick={() => setShowAddNewsModal(false)} className="px-4 py-2 rounded-lg border text-slate-600">ยกเลิก</button>
                    <button type="submit" className="px-4 py-2 rounded-lg bg-blue-600 text-white font-semibold">เผยแพร่ข่าว</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Add Staff Modal (Admin) */}
          {showAddStaffModal && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b pb-2">
                  <h3 className="font-bold text-base text-slate-900">{t.addStaff}</h3>
                  <button onClick={() => setShowAddStaffModal(false)} className="text-slate-400 hover:text-slate-600 text-lg">✕</button>
                </div>
                <form onSubmit={handleCreateStaff} className="space-y-3 text-xs">
                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="block text-slate-700 font-medium mb-1">คำนำหน้า/ตำแหน่งวิชาการ</label>
                      <input type="text" required value={staffTitle} onChange={e => setStaffTitle(e.target.value)} placeholder="ผศ.ดร. / อาจารย์" className="w-full p-2 border rounded-lg" />
                    </div>
                    <div>
                      <label className="block text-slate-700 font-medium mb-1">ชื่อ (ภาษาไทย)</label>
                      <input type="text" required value={staffFnTh} onChange={e => setStaffFnTh(e.target.value)} className="w-full p-2 border rounded-lg" />
                    </div>
                    <div>
                      <label className="block text-slate-700 font-medium mb-1">นามสกุล (ภาษาไทย)</label>
                      <input type="text" required value={staffLnTh} onChange={e => setStaffLnTh(e.target.value)} className="w-full p-2 border rounded-lg" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-700 font-medium mb-1">First Name (EN)</label>
                      <input type="text" required value={staffFnEn} onChange={e => setStaffFnEn(e.target.value)} className="w-full p-2 border rounded-lg" />
                    </div>
                    <div>
                      <label className="block text-slate-700 font-medium mb-1">Last Name (EN)</label>
                      <input type="text" required value={staffLnEn} onChange={e => setStaffLnEn(e.target.value)} className="w-full p-2 border rounded-lg" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-700 font-medium mb-1">ตำแหน่งทางบริหาร/หน้าที่</label>
                      <input type="text" required value={staffPos} onChange={e => setStaffPos(e.target.value)} placeholder="อาจารย์ประจำหลักสูตร" className="w-full p-2 border rounded-lg" />
                    </div>
                    <div>
                      <label className="block text-slate-700 font-medium mb-1">อีเมลติดต่อ</label>
                      <input type="email" required value={staffEmail} onChange={e => setStaffEmail(e.target.value)} placeholder="teacher@faculty.ac.th" className="w-full p-2 border rounded-lg" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-700 font-medium mb-1">เบอร์ภายใน</label>
                      <input type="text" value={staffPhone} onChange={e => setStaffPhone(e.target.value)} className="w-full p-2 border rounded-lg" />
                    </div>
                    <div>
                      <label className="block text-slate-700 font-medium mb-1">ห้องพักอาจารย์</label>
                      <input type="text" value={staffRoom} onChange={e => setStaffRoom(e.target.value)} className="w-full p-2 border rounded-lg" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-slate-700 font-medium mb-1">รูปโปรไฟล์ (Avatar URL)</label>
                    <input type="url" required value={staffAvatar} onChange={e => setStaffAvatar(e.target.value)} className="w-full p-2 border rounded-lg" />
                  </div>
                  <div>
                    <label className="block text-slate-700 font-medium mb-1">ความเชี่ยวชาญ (Expertise)</label>
                    <input type="text" required value={staffExpertise} onChange={e => setStaffExpertise(e.target.value)} placeholder="เช่น Cloud Computing, AI, Database" className="w-full p-2 border rounded-lg" />
                  </div>
                  <div className="flex items-center justify-end gap-2 pt-3 border-t">
                    <button type="button" onClick={() => setShowAddStaffModal(false)} className="px-4 py-2 rounded-lg border text-slate-600">ยกเลิก</button>
                    <button type="submit" className="px-4 py-2 rounded-lg bg-blue-600 text-white font-semibold">เพิ่มบุคลากร</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t bg-slate-900 text-slate-300 py-10 text-xs">
            <div className="max-w-6xl mx-auto px-4 grid grid-cols-1 md:grid-cols-3 gap-6">
              <div className="space-y-2">
                <div className="flex items-center gap-2 text-white font-bold text-sm">
                  <span className="w-6 h-6 rounded bg-blue-600 flex items-center justify-center text-xs">F</span>
                  {t.brandTitle}
                </div>
                <p className="text-slate-400 leading-relaxed">{t.brandTagline}</p>
                <p className="text-slate-500 pt-2">© {new Date().getFullYear()} {t.footerCopyright}</p>
              </div>
              <div>
                <h4 className="font-bold text-white mb-2 text-sm">ระบบบริการ</h4>
                <ul className="space-y-1 text-slate-400">
                  <li className="cursor-pointer hover:text-white" onClick={() => setActiveTab('programs')}>หลักสูตรการศึกษาปริญญาตรีและบัณฑิตศึกษา</li>
                  <li className="cursor-pointer hover:text-white" onClick={() => setActiveTab('bookings')}>ระบบจองห้องประชุมและยานพาหนะ</li>
                  <li className="cursor-pointer hover:text-white" onClick={() => setActiveTab('documents')}>ระบบสารบรรณและอนุมัติเอกสารราชการ</li>
                </ul>
              </div>
              <div>
                <h4 className="font-bold text-white mb-2 text-sm">{t.contactUs}</h4>
                <p className="text-slate-400 leading-relaxed">{t.address}</p>
                <p className="text-slate-400 mt-2">โทร: 035-248-000 ต่อ 9200</p>
                <p className="text-slate-400">อีเมล: 92hotel@mcu.ac.th</p>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
