name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Server / Domain URL (e.g. https://fms.example.ac.th or http://192.168.1.X:3010)"
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "public/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK for Galaxy S23 Ultra
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --ignore-scripts --legacy-peer-deps

      - name: Configure Server URL (if provided)
        env:
          INPUT_SERVER_URL: ${{ github.event.inputs.server_url }}
        run: |
          node -e '
            const fs = require("fs");
            const targetUrl = process.env.INPUT_SERVER_URL || process.env.CAPACITOR_SERVER_URL;
            if (targetUrl) {
              console.log("Configuring server.url to:", targetUrl);
              const path = "android/app/src/main/assets/capacitor.config.json";
              if (fs.existsSync(path)) {
                const cfg = JSON.parse(fs.readFileSync(path, "utf8"));
                cfg.server = cfg.server || {};
                cfg.server.url = targetUrl;
                cfg.server.cleartext = true;
                fs.writeFileSync(path, JSON.stringify(cfg, null, 2));
                console.log("Updated", path, "successfully.");
              }
            }
          '

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x ./android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/FMS-Academic-S23Ultra.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FMS-Academic-S23Ultra-APK
          path: build-output/FMS-Academic-S23Ultra.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: android-latest
          name: "FMS Academic Android APK (Galaxy S23 Ultra)"
          body: |
            ## FMS Academic System - Android APK
            ไฟล์ติดตั้ง `.apk` สำหรับ Samsung Galaxy S23 Ultra (SM-S918B/DS) และ Android 14/15/16
            
            ### วิธีดาวน์โหลดและติดตั้ง:
            1. ดาวน์โหลดไฟล์ `FMS-Academic-S23Ultra.apk` ด้านล่างลงมือถือ
            2. แตะเปิดไฟล์เพื่อติดตั้ง
          draft: false
          prerelease: false
          files: build-output/FMS-Academic-S23Ultra.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
